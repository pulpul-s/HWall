name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - name: Install GTK development files
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libgtk-4-dev pkg-config

      - name: Verify source files
        run: |
          rustup component add clippy rustfmt
          make verify

      - name: Build release
        run: make release
