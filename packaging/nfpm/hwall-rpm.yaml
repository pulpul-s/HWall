# Build target/release inside Fedora before running this config.
name: hwall
arch: "${NFPM_ARCH}"
platform: linux
version: "${VERSION}"
version_schema: semver
release: "${RELEASE}"
maintainer: "${MAINTAINER}"
description: |
  Linux hardware inventory and live sensor monitor.
  HWall provides native GTK 4 and terminal interfaces for hardware inventory,
  live sensors, alerts, history, and optional SMART/NVMe health information.
vendor: "${MAINTAINER}"
# No project license is present in the supplied source. Change this after
# choosing and adding a LICENSE file to the repository.
license: LicenseRef-Proprietary

# scripts/package-rpm.sh creates this staged filesystem with `make install`.
contents:
  - src: ./dist/rpm-root/usr/
    dst: /usr
    type: tree

depends:
  - glibc
  - libgcc
  - gtk4 >= 4.8

# Recommended helpers enable HWall's normal hardware-enrichment features.
recommends:
  - lm_sensors
  - hwdata
  - ethtool
  - smartmontools
  - nvme-cli
  - dmidecode
  - polkit

# Optional vendor telemetry and KDE Plasma window-placement integration.
# The NVIDIA package is supplied by RPM Fusion rather than Fedora itself.
suggests:
  - xorg-x11-drv-nvidia-cuda
  - kf6-kconfig
  - qt6-qttools

rpm:
  # Explicitly set RPMTAG_PACKAGER. Some package viewers otherwise show
  # the packager/author as Unknown even when the top-level maintainer exists.
  packager: "${MAINTAINER}"
  summary: Linux hardware inventory and live sensor monitor
  compression: zstd
