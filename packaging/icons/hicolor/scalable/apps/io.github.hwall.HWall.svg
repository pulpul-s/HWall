  <rect x="58" y="136" width="396" height="240" rx="24"
        fill="url(#screen)" stroke="url(#neon)" stroke-width="4"/>

  <g clip-path="url(#screen-clip)" opacity="0.22" stroke="#7c69c9" stroke-width="2">
    <path d="M62 178H450M62 218H450M62 258H450M62 298H450M62 338H450"/>
    <path d="M110 140V372M158 140V372M206 140V372M254 140V372M302 140V372M350 140V372M398 140V372"/>
  </g>

  <path d="M76 292 L103 253 L124 274 L149 199 L177 303 L204 245 L226 279 L249 211 L274 313 L300 238 L322 265 L345 178 L371 297 L394 238 L414 276 L438 248"
        fill="none" stroke="url(#neon)" stroke-width="16"
