<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bezel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22243d"/>
      <stop offset="0.52" stop-color="#171828"/>
      <stop offset="1" stop-color="#291629"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d8ff"/>
      <stop offset="0.48" stop-color="#a96cff"/>
      <stop offset="1" stop-color="#ff2aa8"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061329"/>
      <stop offset="0.55" stop-color="#0b0921"/>
      <stop offset="1" stop-color="#21091d"/>
    </linearGradient>
    <filter id="soft-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="line-glow" x="-40%" y="-80%" width="180%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="screen-clip">
      <rect x="62" y="140" width="388" height="232" rx="22"/>
    </clipPath>
  </defs>

  <rect x="18" y="94" width="476" height="324" rx="38"
        fill="url(#bezel)" stroke="#050610" stroke-width="8"/>
  <rect x="24" y="100" width="464" height="312" rx="32"
        fill="none" stroke="url(#neon)" stroke-width="5" opacity="0.9" filter="url(#soft-glow)"/>

  <rect x="48" y="126" width="416" height="260" rx="28"
