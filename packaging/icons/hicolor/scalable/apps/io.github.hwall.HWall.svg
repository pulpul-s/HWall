  <path d="M76 292 L103 253 L124 274 L149 199 L177 303 L204 245 L226 279 L249 211 L274 313 L300 238 L322 265 L345 178 L371 297 L394 238 L414 276 L438 248"
        fill="none" stroke="url(#neon)" stroke-width="8"
