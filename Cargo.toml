[workspace]
members = [
    "crates/hwall-core",
    "crates/hwall-cli",
    "crates/hwall-app",
    "crates/hwall-gui",
]
resolver = "2"

[workspace.package]
version = "1.0.5"
edition = "2024"
rust-version = "1.92"
authors = ["pulpul-s"]

[workspace.dependencies]
clap = { version = "4.6.4", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
directories = "6.0.0"
libc = "0.2.189"
